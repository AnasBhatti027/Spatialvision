<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SpatialVision Display</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: system-ui, Segoe UI, Roboto, sans-serif; }
  body.paired { cursor: none; }
  /* All surfaces are drawn on this one canvas with WebGL (built into the browser). */
  #stage { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; }
  #overlay { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #080B16; color: #F4F6FF; text-align: center; padding: 24px; }
  #overlay.hidden { display: none; }
  .brand { color: #45D9F5; font-weight: 700; letter-spacing: 3px; font-size: 18px; }
  #code { font-size: min(22vw, 220px); font-weight: 800; letter-spacing: 0.12em; margin: 8px 0; }
  .mute { color: #A4ADC5; font-size: 22px; line-height: 1.5; }
  .small { color: #586386; font-size: 15px; margin-top: 28px; }
  /* Hand pointer: follows the index fingertip seen by the webcam. */
  /* Moved with transform (GPU), not left/top (page layout), so it follows every update without delay. */
  #pointer { position: fixed; left: 0; top: 0; width: 34px; height: 34px; margin: -17px 0 0 -17px; border-radius: 50%;
    border: 4px solid #45D9F5; background: rgba(69,217,245,0.25); pointer-events: none; display: none;
    will-change: transform; transition: background .12s, border-color .12s, opacity .2s; z-index: 5; }
  #pointer.held { opacity: 0.45; }
  #pointer.pinch { width: 20px; height: 20px; margin: -10px 0 0 -10px; background: #45D9F5; border-color: #FFFFFF; }
  #pointer.open_palm { border-color: #9065FF; background: rgba(144,101,255,0.25); }
  #pointer.hover { border-color: #FFFFFF; }
  #pointer.drag { width: 16px; height: 16px; margin: -8px 0 0 -8px; background: #FFFFFF; border-color: #45D9F5; }
  /* Grab handles on the shape, shown while the hand is in view. */
  #handles { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
  #event { position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%); padding: 8px 18px; border-radius: 20px;
    background: rgba(8,11,22,0.75); color: #45D9F5; font-size: 22px; font-weight: 700; letter-spacing: 1px;
    opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 5; }
  #event.show { opacity: 1; }
</style>
</head>
<body>
<canvas id="stage"></canvas>
<canvas id="handles"></canvas>
<div id="pointer"></div>
<div id="event"></div>
<div id="overlay">
  <div class="brand">SPATIALVISION</div>
  <div id="code">····</div>
  <div class="mute" id="msg">Connecting to the backend…</div>
  <div class="small">Double-click or press F11 for full screen.</div>
</div>
<script>
// ---------- Maths: where a point of a surface lands on the screen ----------
// Each surface has 4 corners on the screen (fractions 0..1). Inside it, (u, v) runs from (0, 0) at corner 1
// to (1, 1) at corner 3. Optional warp points (mesh) bend (u, v) first; then the 4 corners give the perspective.
// The phone app uses exactly the same maths (projection.ts), so the phone preview matches the TV.
function squareToQuad(q) {
  const [[x0, y0], [x1, y1], [x2, y2], [x3, y3]] = q;
  const dx1 = x1 - x2, dx2 = x3 - x2, dx3 = x0 - x1 + x2 - x3;
  const dy1 = y1 - y2, dy2 = y3 - y2, dy3 = y0 - y1 + y2 - y3;
  let g = 0, h = 0;
  if (Math.abs(dx3) > 1e-9 || Math.abs(dy3) > 1e-9) {
    const det = dx1 * dy2 - dx2 * dy1;
    if (Math.abs(det) < 1e-9) return null;
    g = (dx3 * dy2 - dx2 * dy3) / det;
    h = (dx1 * dy3 - dx3 * dy1) / det;
  }
  const a = x1 - x0 + g * x1, b = x3 - x0 + h * x3, c = x0;
  const d = y1 - y0 + g * y1, e = y3 - y0 + h * y3, f = y0;
  if ([[0, 0], [1, 0], [1, 1], [0, 1]].some(([u, v]) => g * u + h * v + 1 <= 1e-6)) return null; // folded shape
  return (u, v) => { const w = g * u + h * v + 1; return [(a * u + b * v + c) / w, (d * u + e * v + f) / w]; };
}
// Smooth curve through the warp points (Catmull-Rom), so a bent surface has no creases between cells.
// With the points in their starting grid it changes nothing.
function crv(a, b, c, d, t) {
  const t2 = t * t, t3 = t2 * t;
  return 0.5 * (2 * b + (c - a) * t + (2 * a - 5 * b + 4 * c - d) * t2 + (3 * b - a - 3 * c + d) * t3);
}
function node(m, a, b) {  // a warp point; outside the grid it continues the edge in a straight line
  const ext = (p, q) => [2 * p[0] - q[0], 2 * p[1] - q[1]];
  if (a < 0) return ext(node(m, 0, b), node(m, 1, b));
  if (a > m.cols) return ext(node(m, m.cols, b), node(m, m.cols - 1, b));
  if (b < 0) return ext(node(m, a, 0), node(m, a, 1));
  if (b > m.rows) return ext(node(m, a, m.rows), node(m, a, m.rows - 1));
  return m.pts[b * (m.cols + 1) + a];
}
function meshAt(m, u, v) {
  const i = Math.min(Math.max(Math.floor(u * m.cols), 0), m.cols - 1), j = Math.min(Math.max(Math.floor(v * m.rows), 0), m.rows - 1);
  const s = u * m.cols - i, t = v * m.rows - j, rows = [];
  for (let k = -1; k <= 2; k++) {
    const P = [node(m, i - 1, j + k), node(m, i, j + k), node(m, i + 1, j + k), node(m, i + 2, j + k)];
    rows.push([crv(P[0][0], P[1][0], P[2][0], P[3][0], s), crv(P[0][1], P[1][1], P[2][1], P[3][1], s)]);
  }
  return [crv(rows[0][0], rows[1][0], rows[2][0], rows[3][0], t), crv(rows[0][1], rows[1][1], rows[2][1], rows[3][1], t)];
}
function warpFn(surf, corners) {
  const H = squareToQuad(corners);
  if (!H) return null;
  return surf.mesh ? (u, v) => { const m = meshAt(surf.mesh, u, v); return H(m[0], m[1]); } : H;
}

// ---------- WebGL drawing ----------
const stage = document.getElementById('stage');
const overlay = document.getElementById('overlay');
const gl = stage.getContext('webgl', { alpha: false, antialias: true, premultipliedAlpha: true });
let prog = null, posBuf = null, uvBuf = null, idxBuf = null, uOpacity = null;
if (gl) {
  const sh = (type, src) => { const x = gl.createShader(type); gl.shaderSource(x, src); gl.compileShader(x); return x; };
  prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, 'attribute vec2 aPos; attribute vec2 aUv; varying vec2 vUv;' +
    'void main(){ vUv = aUv; gl_Position = vec4(aPos.x * 2.0 - 1.0, 1.0 - aPos.y * 2.0, 0.0, 1.0); }'));
  gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, 'precision mediump float; varying vec2 vUv; uniform sampler2D uTex; uniform float uOpacity;' +
    'void main(){ gl_FragColor = texture2D(uTex, vUv) * uOpacity; }'));
  gl.linkProgram(prog); gl.useProgram(prog);
  posBuf = gl.createBuffer(); uvBuf = gl.createBuffer(); idxBuf = gl.createBuffer();
  uOpacity = gl.getUniformLocation(prog, 'uOpacity');
  gl.enable(gl.BLEND); gl.blendFunc(gl.ONE, gl.ONE_MINUS_SRC_ALPHA);  // surfaces later in the list are drawn on top
  gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
}

let scene = { type: 'scene', surfaces: [], selected: null, blackout: false };
function selectedSurface() { return scene.surfaces.find((x) => x.id === scene.selected) || scene.surfaces[0] || null; }

// The picture of each surface (content, grid, shape cut-out) is drawn once into a texture and only redrawn
// when one of those things changes. Moving corners or warp points only moves the mesh, which is cheap.
const TEX_W = 1280, TEX_H = 720;
const textures = {};   // surface id -> { key, tex }
const images = {};     // url -> Image
function imageFor(url) {
  if (!images[url]) {
    const img = new Image();
    img.onload = () => { for (const id in textures) textures[id].key = ''; needsDraw = true; };
    img.src = url;
    images[url] = img;
  }
  return images[url];
}
function drawPattern(g, W, H, grid, label) {
  const cols = 16, rows = 9, cw = W / cols, ch = H / rows;
  if (!grid) { // full test pattern: checkerboard, centre cross and numbered corners
    for (let r = 0; r < rows; r++) for (let c = 0; c < cols; c++) {
      g.fillStyle = (r + c) % 2 ? '#1B2550' : '#4D7CFE';
      g.fillRect(c * cw, r * ch, cw + 1, ch + 1);
    }
  }
  g.strokeStyle = grid ? 'rgba(69,217,245,0.8)' : 'rgba(255,255,255,0.35)';
  g.lineWidth = 2;
  for (let c = 1; c < cols; c++) { g.beginPath(); g.moveTo(c * cw, 0); g.lineTo(c * cw, H); g.stroke(); }
  for (let r = 1; r < rows; r++) { g.beginPath(); g.moveTo(0, r * ch); g.lineTo(W, r * ch); g.stroke(); }
  g.strokeStyle = '#45D9F5'; g.lineWidth = 8; g.strokeRect(4, 4, W - 8, H - 8);
  if (grid) return;
  g.strokeStyle = '#FFFFFF'; g.lineWidth = 4;
  g.beginPath(); g.moveTo(W / 2 - 60, H / 2); g.lineTo(W / 2 + 60, H / 2); g.moveTo(W / 2, H / 2 - 60); g.lineTo(W / 2, H / 2 + 60); g.stroke();
  g.fillStyle = '#FFFFFF'; g.font = `bold ${Math.round(H / 10)}px system-ui, sans-serif`;
  g.textBaseline = 'top'; g.textAlign = 'left'; g.fillText('1', 24, 20);
  g.textAlign = 'right'; g.fillText('2', W - 24, 20);
  g.textBaseline = 'bottom'; g.fillText('3', W - 24, H - 20);
  g.textAlign = 'left'; g.fillText('4', 24, H - 20);
  if (label) {
    g.font = `bold ${Math.round(H / 16)}px system-ui, sans-serif`; g.textAlign = 'center'; g.textBaseline = 'top';
    g.fillText(label, W / 2, H / 2 + 80);
  }
}
function polygon(g, pts, W, H) {
  g.beginPath(); pts.forEach(([u, v], i) => (i ? g.lineTo(u * W, v * H) : g.moveTo(u * W, v * H))); g.closePath();
}
function paintTexture(surf) {
  const W = TEX_W, H = TEX_H;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H;
  const g = cv.getContext('2d');
  g.save();
  // Flip (for rear projection or a mirrored set-up). The shape outline is not flipped.
  g.translate(surf.flipX ? W : 0, surf.flipY ? H : 0); g.scale(surf.flipX ? -1 : 1, surf.flipY ? -1 : 1);
  if (surf.content === 'pattern') drawPattern(g, W, H, false, surf.name);
  else if (surf.content === 'grid') drawPattern(g, W, H, true);
  else if (surf.content === 'color') { g.fillStyle = surf.color || '#4D7CFE'; g.fillRect(0, 0, W, H); }
  else if (surf.content === 'image' && surf.image_url) {
    const img = imageFor(surf.image_url);
    if (img.complete && img.naturalWidth) {
      const sc = (surf.fit === 'cover' ? Math.max : Math.min)(W / img.naturalWidth, H / img.naturalHeight);
      const iw = img.naturalWidth * sc, ih = img.naturalHeight * sc;
      g.drawImage(img, (W - iw) / 2, (H - ih) / 2, iw, ih);
    }
  }
  if (surf.grid && surf.content !== 'grid') drawPattern(g, W, H, true);
  g.restore();
  // Shape cut-out and soft edges (feather): keep the picture only inside the outline.
  const outline = surf.mask || [[0, 0], [1, 0], [1, 1], [0, 1]];
  if (surf.mask || surf.feather > 0) {
    const m = document.createElement('canvas'); m.width = W; m.height = H;
    const mg = m.getContext('2d');
    mg.fillStyle = '#fff'; polygon(mg, outline, W, H); mg.fill();
    let cut = m;
    const r = (surf.feather || 0) * Math.min(W, H);
    if (r > 0) {
      // Move the edge inwards by r, then blur it, so the picture fades to nothing at the outline.
      mg.globalCompositeOperation = 'destination-out'; mg.lineWidth = 2 * r; mg.lineJoin = 'round';
      polygon(mg, outline, W, H); mg.stroke();
      cut = document.createElement('canvas'); cut.width = W; cut.height = H;
      const cg = cut.getContext('2d'); cg.filter = `blur(${r / 2}px)`; cg.drawImage(m, 0, 0);
    }
    g.globalCompositeOperation = 'destination-in'; g.drawImage(cut, 0, 0);
  }
  return cv;
}
function textureFor(surf) {
  const key = JSON.stringify([surf.content, surf.image_url, surf.fit, surf.grid, surf.color, surf.mask, surf.feather,
    surf.flipX, surf.flipY, surf.content === 'pattern' ? surf.name : '', images[surf.image_url]?.complete]);
  let t = textures[surf.id];
  if (!t) t = textures[surf.id] = { key: null, tex: gl.createTexture() };
  if (t.key !== key) {
    t.key = key;
    gl.bindTexture(gl.TEXTURE_2D, t.tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, paintTexture(surf));
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  }
  return t.tex;
}
// Triangle list for an n x n grid (the same for every surface with that n).
const indexCache = {};
function indicesFor(n) {
  if (!indexCache[n]) {
    const out = [];
    for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
      const a = j * (n + 1) + i, b = a + 1, c = a + n + 2, d = a + n + 1;
      out.push(a, b, c, a, c, d);
    }
    indexCache[n] = new Uint16Array(out);
  }
  return indexCache[n];
}
let needsDraw = true;
function drawScene() {
  needsDraw = false;
  if (!gl) return;
  const W = window.innerWidth, H = window.innerHeight, dpr = window.devicePixelRatio || 1;
  if (stage.width !== Math.round(W * dpr) || stage.height !== Math.round(H * dpr)) {
    stage.width = Math.round(W * dpr); stage.height = Math.round(H * dpr);
  }
  gl.viewport(0, 0, stage.width, stage.height);
  gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT);
  if (scene.blackout) return;
  for (const surf of scene.surfaces) {
    if (!surf.visible || surf.content === 'blank' || !(surf.opacity > 0)) continue;
    const corners = surf.id === scene.selected && motion.corners ? motion.corners : surf.corners;
    const warp = warpFn(surf, corners);
    if (!warp) continue;
    // Fine enough that the straight pieces follow the perspective and the warp without visible bends.
    const n = Math.min(48, Math.max(16, surf.mesh ? Math.max(surf.mesh.cols, surf.mesh.rows) * 8 : 16));
    const pos = new Float32Array((n + 1) * (n + 1) * 2), uv = new Float32Array((n + 1) * (n + 1) * 2);
    for (let j = 0, k = 0; j <= n; j++) for (let i = 0; i <= n; i++, k += 2) {
      const u = i / n, v = j / n, p = warp(u, v);
      pos[k] = p[0]; pos[k + 1] = p[1]; uv[k] = u; uv[k + 1] = v;
    }
    const tex = textureFor(surf);
    gl.bindBuffer(gl.ARRAY_BUFFER, posBuf); gl.bufferData(gl.ARRAY_BUFFER, pos, gl.DYNAMIC_DRAW);
    const aPos = gl.getAttribLocation(prog, 'aPos'); gl.enableVertexAttribArray(aPos); gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ARRAY_BUFFER, uvBuf); gl.bufferData(gl.ARRAY_BUFFER, uv, gl.DYNAMIC_DRAW);
    const aUv = gl.getAttribLocation(prog, 'aUv'); gl.enableVertexAttribArray(aUv); gl.vertexAttribPointer(aUv, 2, gl.FLOAT, false, 0, 0);
    gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, idxBuf); gl.bufferData(gl.ELEMENT_ARRAY_BUFFER, indicesFor(n), gl.DYNAMIC_DRAW);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.uniform1f(uOpacity, surf.opacity);
    gl.drawElements(gl.TRIANGLES, n * n * 6, gl.UNSIGNED_SHORT, 0);
  }
  // Textures of deleted surfaces are freed.
  for (const id in textures) if (!scene.surfaces.some((x) => x.id === id)) { gl.deleteTexture(textures[id].tex); delete textures[id]; }
}
/** Turns any scene message into the surfaces form (an old backend sends only one shape). */
function applyScene(m) {
  if (!Array.isArray(m.surfaces)) {
    const one = Object.assign({ id: 's1', name: 'Surface 1', mesh: null, mask: null, color: '#4D7CFE', opacity: 1, feather: 0,
      flipX: false, flipY: false, visible: true, locked: false, content: 'pattern', fit: 'contain', grid: false, image_url: null },
      scene.surfaces[0] || {}, m);
    m = { surfaces: [one], selected: one.id, blackout: false };
  }
  scene = { type: 'scene', surfaces: m.surfaces, selected: m.selected, blackout: !!m.blackout };
  const sel = selectedSurface();
  if (sel) cornersTarget(sel.id, sel.corners);
  needsDraw = true;
}

// Gliding pointer and shape positions (see "Smooth motion between updates" below).
const motion = { target: null, at: 0, vel: [0, 0], shown: null, cornersTarget: null, corners: null, selId: null };
window.addEventListener('resize', () => { needsDraw = true; });
if (!gl) document.getElementById('msg').textContent = 'This browser cannot draw the projection (WebGL is off). Use Chrome or Edge on the PC.';

// ---------- Full screen on double-click ----------
document.addEventListener('dblclick', () => {
  if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen().catch(() => {});
});

// ---------- Connection to the backend ----------
const codeEl = document.getElementById('code');
const msgEl = document.getElementById('msg');
let phones = 0;

function showOverlay() {
  overlay.classList.toggle('hidden', phones > 0);
  document.body.classList.toggle('paired', phones > 0);
}

// ---------- Hand pointer and gesture labels ----------
const pointerEl = document.getElementById('pointer');
const eventEl = document.getElementById('event');
let eventTimer = null;
const EVENT_TEXT = { swipe_right: 'SWIPE →', swipe_left: '← SWIPE', pinch: 'PINCH', open_palm: 'OPEN PALM', point: 'POINT', fist: 'FIST' };

let hideTimer = null;
let pointerCount = 0;
function showPointer(m) {
  // The backend already keeps the dot (dimmed) while the hand is briefly lost, so hide it as soon as it says so.
  if (!m.visible) {
    if (!hideTimer) hideTimer = setTimeout(() => { pointerEl.style.display = 'none'; motion.target = null; motion.shown = null; hideTimer = null; }, 100);
    return;
  }
  clearTimeout(hideTimer); hideTimer = null;
  pointerEl.style.display = 'block';
  pointerTarget(m.x, m.y, !!m.still);  // the dot glides there (see "Smooth motion" below)
  pointerEl.className = (m.drag ? 'drag' : m.hover ? 'hover' : (m.gesture === 'pinch' || m.gesture === 'open_palm' ? m.gesture : ''))
    + (m.held ? ' held' : '');
}
// ---------- Grab handles: corners (move one corner), sides (move one side), inside (move all) ----------
const handlesEl = document.getElementById('handles');
let handState = { show: false, hover: null, drag: null };
let handlesHideTimer = null;
function drawHandles() {
  const W = window.innerWidth, H = window.innerHeight, dpr = window.devicePixelRatio || 1;
  if (handlesEl.width !== Math.round(W * dpr) || handlesEl.height !== Math.round(H * dpr)) {
    handlesEl.width = Math.round(W * dpr); handlesEl.height = Math.round(H * dpr);
  }
  // Show the canvas at exactly the window size. Without this it is shown at its pixel size, so with
  // browser zoom or Windows display scaling the handles were drawn smaller or bigger than the shape.
  handlesEl.style.width = W + 'px'; handlesEl.style.height = H + 'px';
  const g = handlesEl.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, W, H);
  if (!handState.show) return;
  const q = shownCorners().map(([x, y]) => [x * W, y * H]);
  const active = handState.drag || handState.hover;
  const dragging = !!handState.drag;
  // Outline of the shape, brighter while moving the whole shape.
  const whole = active === 'body';
  g.lineWidth = whole ? 4 : 2;
  g.strokeStyle = whole ? (dragging ? '#FFFFFF' : '#45D9F5') : 'rgba(69,217,245,0.6)';
  g.beginPath(); q.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.closePath(); g.stroke();
  // A targeted side lights up along its whole length (only that side moves).
  for (let i = 0; i < 4; i++) {
    if (active !== 'edge:' + i) continue;
    const a = q[i], b = q[(i + 1) % 4];
    g.lineWidth = 7; g.lineCap = 'round';
    g.strokeStyle = dragging ? '#FFFFFF' : '#45D9F5';
    g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
  }
  const dot = (x, y, r, on, square) => {
    g.lineWidth = 3;
    g.fillStyle = on ? (dragging ? '#FFFFFF' : '#45D9F5') : 'rgba(144,101,255,0.85)';
    g.strokeStyle = on ? '#45D9F5' : '#FFFFFF';
    g.beginPath();
    if (square) g.rect(x - r, y - r, 2 * r, 2 * r); else g.arc(x, y, r, 0, Math.PI * 2);
    g.fill(); g.stroke();
  };
  for (let i = 0; i < 4; i++) {
    const a = q[i], b = q[(i + 1) % 4];
    dot((a[0] + b[0]) / 2, (a[1] + b[1]) / 2, active === 'edge:' + i ? 11 : 7, active === 'edge:' + i, true);
  }
  q.forEach(([x, y], i) => dot(x, y, active === 'corner:' + i ? 20 : 13, active === 'corner:' + i, false));
}
function updateHandles(m) {
  if (m.visible) {
    clearTimeout(handlesHideTimer); handlesHideTimer = null;
    handState = { show: true, hover: m.hover || null, drag: m.drag || null };
    drawHandles();
  } else if (!handlesHideTimer) {
    handlesHideTimer = setTimeout(() => { handState = { show: false, hover: null, drag: null }; drawHandles(); handlesHideTimer = null; }, 1500);
  }
}
window.addEventListener('resize', drawHandles);

// ---------- Smooth motion between updates ----------
// The phone's hand tracking sends a new position only 10-15 times a second, sometimes with pauses
// (measured 9 Nov on a 5-year-old phone), while this page redraws 60 times a second. Instead of
// jumping on each update and freezing in between, the pointer and the shape glide to the newest
// position, and during a short gap the pointer keeps going the way the hand was moving. This runs
// only here on the display, so the phone does no extra work.
const GLIDE_S = 0.045;       // how quickly the shown position catches up with the newest one
const PREDICT_MAX_S = 0.06;  // keep a movement going for at most this long when an update is late
const PREDICT_MAX = 0.008;   // ...and never more than this far ahead (fraction of the screen), so stops stay crisp
function pointerTarget(x, y, still) {
  const now = performance.now() / 1000;
  if (still) {  // the backend has locked the pointer (hand still, or pinching): stop, no prediction
    motion.vel = [0, 0];
  } else if (motion.target) {
    const dt = now - motion.at;
    if (dt > 0.005 && dt < 0.3) {
      const vx = (x - motion.target[0]) / dt, vy = (y - motion.target[1]) / dt;
      motion.vel = [0.5 * motion.vel[0] + 0.5 * vx, 0.5 * motion.vel[1] + 0.5 * vy];
    } else if (dt >= 0.3) motion.vel = [0, 0];
  } else motion.vel = [0, 0];
  motion.target = [x, y]; motion.at = now;
  if (!motion.shown) motion.shown = [x, y];
}
function cornersTarget(id, c) {
  motion.cornersTarget = c.map((p) => [p[0], p[1]]);
  // A newly selected surface starts where it is; only changes of the same surface glide.
  // Gliding is for hand gestures (a few updates a second). A finger drag on the phone sends ~30 updates
  // a second, so without a hand in view the shape jumps straight to the newest position (no added delay).
  if (!motion.corners || motion.selId !== id || !handState.show) motion.corners = c.map((p) => [p[0], p[1]]);
  motion.selId = id;
}
function shownCorners() { return motion.corners || selectedSurface()?.corners || [[0, 0], [1, 0], [1, 1], [0, 1]]; }
let lastFrame = performance.now() / 1000;
function frame() {
  const now = performance.now() / 1000, dt = Math.min(now - lastFrame, 0.1);
  lastFrame = now;
  const k = 1 - Math.exp(-dt / GLIDE_S);
  if (motion.target && motion.shown) {
    const ahead = Math.min(now - motion.at, PREDICT_MAX_S);
    let px = motion.vel[0] * ahead, py = motion.vel[1] * ahead;
    const len = Math.hypot(px, py);
    if (len > PREDICT_MAX) { px *= PREDICT_MAX / len; py *= PREDICT_MAX / len; }
    const aimX = Math.min(1, Math.max(0, motion.target[0] + px)), aimY = Math.min(1, Math.max(0, motion.target[1] + py));
    motion.shown = [motion.shown[0] + (aimX - motion.shown[0]) * k, motion.shown[1] + (aimY - motion.shown[1]) * k];
    pointerEl.style.transform = `translate3d(${motion.shown[0] * window.innerWidth}px, ${motion.shown[1] * window.innerHeight}px, 0)`;
  }
  if (motion.cornersTarget && motion.corners) {
    let moved = false;
    motion.corners = motion.corners.map((p, i) => {
      const t = motion.cornersTarget[i];
      const nx = p[0] + (t[0] - p[0]) * k, ny = p[1] + (t[1] - p[1]) * k;
      if (Math.abs(nx - t[0]) > 1e-5 || Math.abs(ny - t[1]) > 1e-5) moved = true;
      return moved ? [nx, ny] : [nx, ny];
    });
    if (moved || motion.cornersMoving) {
      if (!moved) motion.corners = motion.cornersTarget.map((p) => [p[0], p[1]]);  // settle exactly on the target
      needsDraw = true;
      drawHandles();
    }
    motion.cornersMoving = moved;
  }
  if (needsDraw) drawScene();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

function showEvent(name) {
  eventEl.textContent = EVENT_TEXT[name] || name;
  eventEl.classList.add('show');
  clearTimeout(eventTimer);
  eventTimer = setTimeout(() => eventEl.classList.remove('show'), 900);
}

function connect() {
  const ws = new WebSocket(`ws://${location.host}/ws/tv`);
  ws.onmessage = (e) => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.type === 'pair_code') {
      codeEl.textContent = m.code;
      msgEl.innerHTML = `On your phone open SpatialVision → <b>Connect</b>.<br>PC address <b>${location.hostname}</b>, port <b>${location.port || 80}</b>, then enter this code.`;
    } else if (m.type === 'phones') {
      phones = m.count; showOverlay();
    } else if (m.type === 'scene') {
      applyScene(m);
      drawHandles();
    } else if (m.type === 'pointer') {
      showPointer(m);
      updateHandles(m);
      // Every 5th pointer: once it is drawn, send its time back so the backend can measure the delay.
      if (m.visible && m.t !== undefined && ++pointerCount % 5 === 0) {
        requestAnimationFrame(() => { if (ws.readyState === 1) ws.send(JSON.stringify({ type: 'pointer_ack', t: m.t })); });
      }
    } else if (m.type === 'gesture') {
      showEvent(m.name);
    }
  };
  ws.onclose = () => {
    phones = 0; showOverlay();
    codeEl.textContent = '····';
    msgEl.textContent = 'Lost connection to the backend. Retrying…';
    setTimeout(connect, 2000);
  };
}
connect();
</script>
